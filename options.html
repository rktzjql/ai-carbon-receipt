<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gemini Carbon Receipt 설정</title><link rel="stylesheet" href="style.css"></head><body><header><h1>API 키 설정</h1><a href="panel.html">측정 패널 열기</a></header><main><section><p>본인의 Gemini API 키를 입력하세요. 키는 확장프로그램의 접근 제한된 <code>chrome.storage.session</code>에만 저장됩니다. 브라우저 재시작·확장프로그램 재로드 후 다시 입력해야 합니다.</p><p>Gemini 페이지와 content script에는 키를 전달하지 않습니다. API 요청은 background service worker에서 처리합니다.</p><form id="keyForm"><label for="key">Gemini API 키</label><input id="key" type="password" autocomplete="off" spellcheck="false" required><button type="submit">이번 세션에 저장</button></form><button id="removeKey">저장한 키 삭제</button><p id="notice" role="status"></p><a href="https://aistudio.google.com/apikey" target="_blank" rel="noreferrer">Google AI Studio에서 키 관리</a></section></main><script type="module" src="options.js"></script></body></html>
